<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GELIN Commerce OS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#172033}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px}.app{display:flex;min-height:100vh}.side{width:245px;background:#101827;color:#fff;padding:18px}.brand{font-size:21px;font-weight:800;margin-bottom:20px}.brand small{display:block;color:#94a3b8;font-size:11px}.nav button{display:block;width:100%;text-align:right;background:transparent;color:#cbd5e1;margin:4px 0}.nav .on,.nav button:hover{background:#1d2a40;color:#fff}.main{flex:1}.top{height:68px;background:#fff;border-bottom:1px solid #e5eaf1;display:flex;justify-content:space-between;align-items:center;padding:0 24px}.content{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e5e9f0;border-radius:15px;padding:17px;box-shadow:0 4px 16px #10182708}.title{font-size:25px;font-weight:800;margin:0}.muted{color:#718096}.kpi{font-size:27px;font-weight:800;margin-top:8px}.row,.between{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:#0f8f6b;color:white}.dark{background:#172033;color:#fff}.light{background:#eef2f7;color:#243047}.danger{background:#d94b4b;color:#fff}.input{width:100%;padding:11px;border:1px solid #d7deea;border-radius:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f6f1;color:#087457;font-size:12px;font-weight:700}.pill.gray{background:#eef2f7;color:#5b687c}.hero{background:linear-gradient(135deg,#101827,#1d3553);color:#fff;border-radius:18px;padding:28px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{color:#cbd5e1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:right}.section{margin-top:16px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7f5}.loginbox{width:min(460px,100%);background:white;border-radius:22px;padding:28px;box-shadow:0 20px 60px #11182718}.logo{text-align:center;font-size:28px;font-weight:900}.tabs{display:flex;background:#f1f4f8;padding:5px;border-radius:12px;margin:18px 0}.tabs button{flex:1;background:transparent}.tabs .active{background:#fff;box-shadow:0 2px 8px #0001}.notice{background:#fff7db;color:#765600;padding:12px;border-radius:10px;margin-top:12px}.chart{height:170px;display:flex;gap:9px;align-items:end}.bar{flex:1;background:#0f8f6b;border-radius:7px 7px 2px 2px}.feature{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f4}.preview{background:#fff;border:1px solid #e5e9f0;border-radius:15px;overflow:hidden}.phead{padding:15px;font-weight:800;border-bottom:1px solid #eee}.phero{padding:35px;background:#f0f7f4}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}.product{border:1px solid #e7ebf0;border-radius:12px;padding:15px}@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}.side{width:100%}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.g4,.g3,.g2{grid-template-columns:1fr}.top{padding:0 12px}.content{padding:13px}.products{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script>const K='gelin_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{users:[{id:1,name:'Super Admin',email:'admin@gelin.local',role:'superadmin',trialUntil:Date.now()+31536000000}],products:[{id:1,name:'منتج تجريبي',sku:'DEMO-01',price:3800,cost:1500,stock:80}],orders:[{id:'ORD-1001',customer:'محمد',wilaya:'Sétif',total:3800,status:'DELIVERED',source:'Meta Ads'}],stores:[{id:1,name:'Demo Store',ecommerce:true}],pages:[],integrations:{meta:false,tiktok:false,google:false},trial:3};let uid=null,page='dashboard';const save=()=>localStorage.setItem(K,JSON.stringify(db));const me=()=>db.users.find(x=>x.id===uid);const money=n=>new Intl.NumberFormat('fr-DZ').format(n)+' DZD';const esc=s=>String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function auth(){root.innerHTML='<div class="login"><div class="loginbox"><div class="logo">GELIN Commerce OS</div><div class="muted" style="text-align:center">Algerian E-Commerce Infrastructure</div><div class="tabs"><button id="a" class="active" onclick="form(0)">دخول</button><button id="b" onclick="form(1)">حساب جديد</button></div><div id="f"></div><div class="notice">Demo محلي: Google/Facebook وMeta/TikTok سيصبحان OAuth/API حقيقيين بعد إعداد Secrets في Render.</div></div></div>';form(0)}function form(x){a.classList.toggle('active',!x);b.classList.toggle('active',x);f.innerHTML=x?'<div class="field"><label>الاسم</label><input id="n" class="input"></div><div class="field"><label>البريد</label><input id="e" class="input"></div><button class="primary" style="width:100%" onclick="signup()">إنشاء الحساب</button><div class="row" style="margin-top:10px"><button class="light" onclick="social(\'Google\')">Google</button><button class="light" onclick="social(\'Facebook\')">Facebook</button></div>':'<div class="field"><label>البريد</label><input id="e" class="input" placeholder="admin@gelin.local"></div><button class="primary" style="width:100%" onclick="login()">دخول</button><div class="row" style="margin-top:10px"><button class="light" onclick="social(\'Google\')">Google</button><button class="light" onclick="social(\'Facebook\')">Facebook</button></div><p class="small muted">Super Admin: admin@gelin.local</p>'}function login(){let u=db.users.find(x=>x.email===e.value.trim().toLowerCase());if(!u)return alert('الحساب غير موجود');uid=u.id;page=u.role==='superadmin'?'admin':'dashboard';render()}function signup(){let n1=n.value.trim(),em=e.value.trim().toLowerCase();if(!n1||!em)return alert('أدخل الاسم والبريد');if(db.users.some(x=>x.email===em))return alert('الحساب موجود');let u={id:Date.now(),name:n1,email:em,role:'merchant',trialUntil:Date.now()+db.trial*86400000};db.users.push(u);db.stores.push({id:Date.now()+1,name:'متجري الجديد',ecommerce:true});save();uid=u.id;page='dashboard';render()}function social(p){let em=prompt('Demo '+p+' — أدخل بريدك');if(!em)return;em=em.toLowerCase().trim();let u=db.users.find(x=>x.email===em);if(!u){u={id:Date.now(),name:p+' User',email:em,role:'merchant',trialUntil:Date.now()+db.trial*86400000};db.users.push(u);save()}uid=u.id;page='dashboard';render()}const navs=[['dashboard','لوحة التحكم'],['products','المنتجات'],['orders','الطلبات'],['builder','AI Website Builder'],['landing','Landing Pages'],['storefront','Storefront'],['customers','CRM'],['delivery','التوصيل'],['marketing','Meta & TikTok Ads'],['finance','المالية'],['analytics','Analytics'],['integrations','Integrations'],['settings','الإعدادات']];function nav(){return '<aside class="side"><div class="brand">GELIN <span style="color:#00c48c">Commerce OS</span><small>Algeria E-Commerce OS</small></div><div class="nav">'+navs.map(x=>`<button class="${page===x[0]?'on':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('')+(me().role==='superadmin'?'<hr><button class="'+(page==='admin'?'on':'')+'" onclick="page=\'admin\';render()">⚙ Super Admin</button>':'')+'<button onclick="uid=null;auth()">تسجيل الخروج</button></div></aside>'}function shell(c){root.innerHTML='<div class="app">'+nav()+'<main class="main"><div class="top"><b>GELIN Commerce OS</b><span>'+esc(me().name)+' · '+esc(me().email)+'</span></div><div class="content">'+c+'</div></main></div>'}function dashboard(){let s=db.orders.reduce((a,x)=>a+x.total,0);return `<div class="hero"><h1>مرحباً ${esc(me().name)} 👋</h1><p>منصة واحدة للـCOD، المواقع، صفحات البيع، التوصيل وقياس الإعلانات.</p><span class="pill">Trial: ${me().role==='superadmin'?'∞':new Date(me().trialUntil).toLocaleDateString('ar-DZ')}</span></div><div class="grid g4 section"><div class="card">Revenue<div class="kpi">${money(s)}</div></div><div class="card">Orders<div class="kpi">${db.orders.length}</div></div><div class="card">Products<div class="kpi">${db.products.length}</div></div><div class="card">Stores<div class="kpi">${db.stores.length}</div></div></div><div class="grid g2 section"><div class="card"><b>Sales Overview</b><div class="chart">${[30,45,38,60,52,78,90].map(v=>`<div class="bar" style="height:${v}%"></div>`).join('')}</div></div><div class="card"><b>Order Funnel</b><div class="feature"><span>New</span><b>${db.orders.length}</b></div><div class="feature"><span>Delivered</span><b>${db.orders.filter(x=>x.status==='DELIVERED').length}</b></div></div></div>`}function products(){return `<div class="between"><div><h2 class="title">Products</h2><span class="muted">Stock, price, cost, SKU</span></div><button class="primary" onclick="addProduct()">+ منتج</button></div><div class="card section"><table class="table"><tr><th>Product</th><th>SKU</th><th>Price</th><th>Cost</th><th>Stock</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.sku}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td></tr>`).join('')}</table></div>`}function addProduct(){let n=prompt('اسم المنتج');if(!n)return;db.products.push({id:Date.now(),name:n,sku:'SKU-'+Date.now(),price:3800,cost:1500,stock:100});save();render()}function orders(){return `<div class="between"><h2 class="title">Orders</h2><button class="primary" onclick="addOrder()">+ طلب</button></div><div class="card section"><table class="table"><tr><th>ID</th><th>Customer</th><th>Wilaya</th><th>Total</th><th>Status</th><th>Source</th></tr>${db.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.customer)}</td><td>${esc(o.wilaya)}</td><td>${money(o.total)}</td><td><span class="pill">${o.status}</span></td><td>${o.source}</td></tr>`).join('')}</table></div>`}function addOrder(){db.orders.unshift({id:'ORD-'+Math.floor(Math.random()*9000+1000),customer:'عميل جديد',wilaya:'Algeria',total:3800,status:'NEW',source:'TikTok Ads'});save();render()}function builder(){return `<div class="hero"><h1>AI Website Builder</h1><p>اكتب وصف المتجر ليتم بناء هيكل متجر RTL احترافي. هذا الـPrototype يثبت تجربة المستخدم؛ مولّد AI الحقيقي سيتم ربطه بالBackend.</p><input id="brief" class="input" placeholder="مثال: متجر تجميل جزائري أسود وذهبي COD"><br><br><button class="primary" onclick="genSite()">Generate Website</button></div><div id="out" class="section"></div>`}function genSite(){out.innerHTML='<div class="preview"><div class="phead">AI Generated Store</div><div class="phero"><h2>متجر احترافي للجزائر</h2><p>الدفع عند الاستلام · توصيل · CTA</p><button class="primary">اطلب الآن</button></div><div class="products">'+['منتج 1','منتج 2','منتج 3'].map(x=>`<div class="product"><b>${x}</b><p class="muted">وصف تسويقي مولد</p><b>${money(3800)}</b></div>`).join('')+'</div></div>'}function landing(){return `<div class="between"><h2 class="title">Landing Pages</h2><button class="primary" onclick="newPage()">+ إنشاء</button></div><div class="grid g3 section">${(db.pages.length?db.pages:[{name:'Demo COD Landing',status:'DRAFT'}]).map(x=>`<div class="card"><b>${esc(x.name)}</b><p class="muted">Product / COD / Campaign</p><span class="pill">${x.status}</span></div>`).join('')}</div>`}function newPage(){let n=prompt('اسم الصفحة');if(!n)return;db.pages.push({name:n,status:'DRAFT'});save();render()}function storefront(){return `<h2 class="title">Storefront Preview</h2><div class="preview section"><div class="phead">GELIN Store · COD</div><div class="phero"><h1>اشتري الآن وادفع عند الاستلام</h1><p>توصيل للولايات · تأكيد سريع</p><button class="primary">اطلب الآن</button></div><div class="products">${db.products.map(p=>`<div class="product"><h3>${esc(p.name)}</h3><b>${money(p.price)}</b></div>`).join('')}</div></div>`}function customers(){return `<h2 class="title">Customers / CRM</h2><div class="card section"><table class="table"><tr><th>Customer</th><th>Orders</th><th>Spent</th><th>Source</th></tr><tr><td>محمد</td><td>3</td><td>${money(11400)}</td><td>Meta Ads</td></tr></table></div>`}function delivery(){return `<h2 class="title">Delivery Integrations</h2><div class="grid g3 section">${['Yalidine','ZR Express','NOEST','Ecotrack','Maystro','Custom API'].map(x=>`<div class="card"><b>${x}</b><p class="muted">API URL · Token · Webhook · Tracking</p><span class="pill gray">NOT CONNECTED</span></div>`).join('')}</div>`}function marketing(){return `<div class="hero"><h1>Meta Ads & TikTok Ads</h1><p>كل تاجر يربط حساب الإعلانات الخاص به. OAuth + Pixel + CAPI/Events API + Campaign/Ad attribution + Spend/CPA/ROAS/Profit.</p></div><div class="grid g3 section">${[['meta','Meta Ads','Marketing API · Ad Account · Pixel · CAPI'],['tiktok','TikTok Ads','Business API · Pixel · Events API'],['google','Google Analytics','GA4 · UTM · conversions']].map(x=>`<div class="card"><div class="between"><b>${x[1]}</b><span class="pill ${db.integrations[x[0]]?'':'gray'}">${db.integrations[x[0]]?'CONNECTED':'NOT CONNECTED'}</span></div><p class="muted">${x[2]}</p><button class="${db.integrations[x[0]]?'danger':'primary'}" onclick="toggleInt('${x[0]}')">${db.integrations[x[0]]?'Disconnect':'Connect'}</button></div>`).join('')}</div><div class="card section"><h3>Attribution</h3><table class="table"><tr><th>Source</th><th>Spend</th><th>Orders</th><th>Revenue</th><th>CPA</th><th>ROAS</th></tr><tr><td>Meta Ads</td><td>$7</td><td>1</td><td>${money(3800)}</td><td>$7</td><td>—</td></tr><tr><td>TikTok Ads</td><td>$0</td><td>0</td><td>${money(0)}</td><td>—</td><td>—</td></tr></table></div><div class="notice">في الإنتاج لن يتم تخزين Access Tokens داخل الواجهة. سيتم حفظها في Backend/Secrets، مع عزل كل متجر عن الآخر.</div>`}function toggleInt(k){db.integrations[k]=!db.integrations[k];save();render()}function finance(){let r=db.orders.reduce((a,x)=>a+x.total,0),c=db.orders.length*1500;return `<h2 class="title">Finance</h2><div class="grid g4 section"><div class="card">Revenue<div class="kpi">${money(r)}</div></div><div class="card">Product Cost<div class="kpi">${money(c)}</div></div><div class="card">Ad Spend<div class="kpi">$7</div></div><div class="card">Profit<div class="kpi">${money(r-c)}</div></div></div>`}function analytics(){return `<h2 class="title">Analytics</h2><div class="grid g3 section"><div class="card">Confirmation Rate<div class="kpi">—</div></div><div class="card">Delivery Rate<div class="kpi">—</div></div><div class="card">AOV<div class="kpi">${money(db.orders.reduce((a,x)=>a+x.total,0)/Math.max(1,db.orders.length))}</div></div></div>`}function integrations(){return `<h2 class="title">Integrations & Webhooks</h2><div class="grid g2 section"><div class="card"><h3>Marketing</h3><div class="feature">Meta OAuth <span class="pill">Ready</span></div><div class="feature">TikTok OAuth <span class="pill">Ready</span></div><div class="feature">UTM Attribution <span class="pill">Ready</span></div></div><div class="card"><h3>Events</h3>${['order.created','order.updated','order.confirmed','order.shipped','order.delivered','order.cancelled','product.updated','inventory.updated','customer.created'].map(x=>`<div class="feature">${x}<span class="pill gray">API</span></div>`).join('')}</div></div>`}function settings(){return `<h2 class="title">Settings</h2><div class="card section"><h3>Trial</h3><div class="field"><label>Trial days</label><input id="td" class="input" type="number" value="${db.trial}"></div><button class="primary" onclick="db.trial=Number(td.value)||3;save();alert('Saved')">Save</button></div>`}function admin(){return `<div class="hero"><h1>Super Admin</h1><p>Users · Stores · Trial · activation architecture.</p></div><div class="grid g4 section"><div class="card">Users<div class="kpi">${db.users.length}</div></div><div class="card">Stores<div class="kpi">${db.stores.length}</div></div><div class="card">Trial<div class="kpi">${db.trial}d</div></div><div class="card">Connected APIs<div class="kpi">${Object.values(db.integrations).filter(Boolean).length}</div></div></div><div class="card section"><h3>Users</h3><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Trial</th><th>Action</th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.role==='superadmin'?'∞':new Date(u.trialUntil).toLocaleDateString('ar-DZ')}</td><td><button class="light" onclick="extend(${u.id})">+7 days</button></td></tr>`).join('')}</table></div>`}function extend(id){let u=db.users.find(x=>x.id===id);u.trialUntil=Math.max(Date.now(),u.trialUntil||0)+604800000;save();render()}function render(){if(!uid)return auth();let fn={dashboard,products,orders,builder,landing,storefront,customers,delivery,marketing,finance,analytics,integrations,settings,admin}[page]||dashboard;shell(fn())}auth();</script></body></html>
