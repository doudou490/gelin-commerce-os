<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DZ Sales Agent</title>
<style>
:root{--bg:#07111d;--p:#0e1b2c;--p2:#12243a;--line:#263c58;--txt:#edf5ff;--muted:#8fa6c2;--g:#00b686;--r:#ff5e72;--y:#f2c65d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101b,#0c1929);color:var(--txt);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.top,.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{margin:0 0 6px}.muted{color:var(--muted)}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,.input,.select{border:1px solid #36516f;background:#14263d;color:#fff;border-radius:10px;padding:10px 13px}.btn{cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{background:var(--g);border-color:var(--g);color:#04130f;font-weight:800}.danger{background:#321821;border-color:#703443}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0}.card,.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi{font-size:27px;font-weight:900;margin-top:7px}.label{color:var(--muted);font-size:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right}.table th{color:#9eb4cf;font-size:12px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#192f49;border:1px solid #2d4868;font-size:12px}.score{font-weight:900}.high{color:#39d9aa}.mid{color:var(--y)}.low{color:#ff8191}.empty{text-align:center;padding:55px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:20px;z-index:20;padding:13px 16px;border-radius:12px;background:#152940;border:1px solid #41607f;box-shadow:0 15px 40px #0008}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{width:min(950px,100%);max-height:92vh;overflow:auto;background:#0d1a2b;border:1px solid #36516f;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#091522;border:1px solid var(--line);border-radius:12px;padding:13px}.msg{white-space:pre-wrap;line-height:1.8;background:#07111d;border:1px solid var(--line);padding:14px;border-radius:12px}.health{padding:7px 10px;border-radius:99px;background:#14263d;font-size:12px}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:13px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
 <div class="brand"><h1>🎯 DZ Sales Agent</h1><div class="muted">Lead Discovery → Audit → Qualification → Outreach → Follow-up</div></div>
 <div class="actions">
  <span id="health" class="health">جاري التحقق...</span>
  <button id="discover" class="btn primary">🔎 اكتشاف مجاني</button>
  <button id="demo" class="btn">🧪 Demo</button>
  <button id="follow" class="btn">⏰ Follow-ups</button>
  <button id="csv" class="btn">⬇ CSV</button>
 </div>
</div>
<div id="stats" class="cards"></div>
<div class="panel">
 <div class="toolbar">
  <input id="q" class="input" placeholder="ابحث عن Business / Phone / Website">
  <select id="city" class="select"><option value="">كل المدن</option></select>
  <select id="cat" class="select"><option value="">كل التصنيفات</option></select>
  <select id="status" class="select"><option value="">كل الحالات</option></select>
  <button id="refresh" class="btn">↻ تحديث</button>
  <button id="manual" class="btn">＋ Lead يدوي</button>
 </div>
 <div id="table"></div>
</div>
</div>
<div id="modal" class="modal" style="display:none"><div id="modalbox" class="modalbox"></div></div>
<div id="toast" class="toast" style="display:none"></div>
<script>
const $=x=>document.getElementById(x);let S={leads:[],stats:{}};
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"content-type":"application/json"}});let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||("HTTP "+r.status));return x}
function toast(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",3500)}
function loading(b,t){b.disabled=true;b.dataset.old=b.textContent;b.textContent=t}
function done(b){b.disabled=false;b.textContent=b.dataset.old}
function sc(n){return n>=70?"high":n>=40?"mid":"low"}
async function load(){const p=new URLSearchParams({q:$("q").value,city:$("city").value,category:$("cat").value,status:$("status").value});S=await api("/api/leads?"+p);renderFilters();render()}
function renderFilters(){if($("city").options.length===1)$("city").innerHTML='<option value="">كل المدن</option>'+S.cities.map(x=>'<option>'+esc(x)+'</option>').join("");if($("cat").options.length===1)$("cat").innerHTML='<option value="">كل التصنيفات</option>'+S.categories.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join("");if($("status").options.length===1)$("status").innerHTML='<option value="">كل الحالات</option>'+["NEW","RESEARCHED","QUALIFIED","MESSAGE_READY","APPROVED","CONTACTED","FOLLOW_UP_1","FOLLOW_UP_2","FOLLOW_UP_FINAL","REPLIED","INTERESTED","PRICE_REQUESTED","MEETING","CLIENT","NOT_INTERESTED","OPTED_OUT"].map(x=>'<option>'+x+'</option>').join("")}
function render(){const s=S.stats||{},c=s.counts||{};const a=[["كل Leads",s.total||0],["High potential",s.highPotential||0],["Message ready",c.MESSAGE_READY||0],["Approved",c.APPROVED||0],["Interested",c.INTERESTED||0],["Follow-ups due",s.followupsDue||0]];$("stats").innerHTML=a.map(x=>'<div class="card"><span class="label">'+x[0]+'</span><div class="kpi">'+x[1]+'</div></div>').join("");const l=S.leads||[];if(!l.length){$("table").innerHTML='<div class="empty"><b>لا توجد Leads</b>اضغط Demo لاختبار النظام أو اكتشاف مجاني للبحث في Sétif وEl Eulma.</div>';return}$("table").innerHTML='<div class="tablewrap"><table class="table"><tr><th>Business</th><th>City</th><th>Service</th><th>Score</th><th>Status</th><th>Contact</th><th></th></tr>'+l.map(x=>'<tr><td><b>'+esc(x.businessName)+'</b><br><span class="muted">'+esc(x.categoryLabel||x.category)+'</span></td><td>'+esc(x.city)+'</td><td><span class="tag">'+esc(x.recommendedServiceLabel||"—")+'</span></td><td><span class="score '+sc(x.score||0)+'">'+(x.score||0)+'/100</span></td><td><span class="tag">'+esc(x.status)+'</span></td><td>'+esc(x.phone||x.website||"—")+'</td><td><button class="btn" onclick="openLead(\''+x.id+'\')">فتح</button></td></tr>').join("")+'</table></div>'}
function openM(x){$("modalbox").innerHTML=x;$("modal").style.display="flex"}function closeM(){$("modal").style.display="none"}$("modal").onclick=e=>{if(e.target===$("modal"))closeM()}
function openLead(id){const l=S.leads.find(x=>x.id===id);if(!l)return;openM('<div class="between"><div><h2>'+esc(l.businessName)+'</h2><span class="muted">'+esc(l.city)+' • '+esc(l.categoryLabel||l.category)+'</span></div><button class="btn" onclick="closeM()">✕</button></div><div class="grid2"><div class="metric"><b>Lead Score</b><h2>'+esc(l.score||0)+'/100</h2></div><div class="metric"><b>الخدمة المقترحة</b><h3>'+esc(l.recommendedServiceLabel||"—")+'</h3></div></div><p><b>الملاحظة:</b> '+esc(l.observation||"—")+'</p><p><b>Pain points:</b> '+esc((l.painPoints||[]).join(" • ")||"—")+'</p><p><b>Website:</b> '+esc(l.website||"لا يوجد")+'<br><b>Phone:</b> '+esc(l.phone||"—")+'</p>'+(l.audit?'<div class="metric"><b>Website Audit</b><br>'+esc((l.audit.notes||[]).join(" • ")||"لا توجد ملاحظات")+'</div>':"")+'<h3>رسالة Outreach</h3><div class="msg">'+esc(l.message||"لا توجد رسالة")+'</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="approve(\''+id+'\')">✅ اعتماد</button><button class="btn" onclick="analyze(\''+id+'\')">🤖 إعادة التحليل</button><button class="btn" onclick="copyMsg(\''+id+'\')">📋 نسخ</button><button class="btn" onclick="statusSet(\''+id+'\',\'CONTACTED\')">📨 تم التواصل</button><button class="btn" onclick="statusSet(\''+id+'\',\'INTERESTED\')">🔥 مهتم</button><button class="btn danger" onclick="delLead(\''+id+'\')">حذف</button></div>')}
async function demo(){const b=$("demo");loading(b,"⏳ Demo...");try{const x=await api("/api/demo",{method:"POST"});toast("تمت إضافة "+x.added+" Leads تجريبية");await load()}catch(e){toast("Demo: "+e.message)}done(b)}
async function discover(){const b=$("discover");loading(b,"⏳ البحث...");try{const x=await api("/api/discover",{method:"POST"});toast("وجدنا "+x.found+" وأضافنا "+x.added+" Lead");await load()}catch(e){toast("Discovery: "+e.message)}done(b)}
async function approve(id){try{await api("/api/leads/"+id+"/approve",{method:"POST"});toast("تم اعتماد الرسالة ووضعها في Queue");closeM();load()}catch(e){toast(e.message)}}
async function analyze(id){try{await api("/api/leads/"+id+"/analyze",{method:"POST"});toast("تمت إعادة التحليل");closeM();load()}catch(e){toast(e.message)}}
async function statusSet(id,status){try{await api("/api/leads/"+id+"/status",{method:"POST",body:JSON.stringify({status})});toast("تم تغيير الحالة إلى "+status);closeM();load()}catch(e){toast(e.message)}}
async function delLead(id){if(!confirm("حذف Lead؟"))return;try{await api("/api/leads/"+id,{method:"DELETE"});toast("تم الحذف");closeM();load()}catch(e){toast(e.message)}}
async function copyMsg(id){const l=S.leads.find(x=>x.id===id);try{await navigator.clipboard.writeText(l.message||"");toast("تم نسخ الرسالة")}catch{toast("تعذر النسخ")}}
$("demo").onclick=demo;$("discover").onclick=discover;$("refresh").onclick=load;$("csv").onclick=()=>location.href="/api/export.csv";
$("follow").onclick=async()=>{const b=$("follow");loading(b,"⏳ Follow-ups...");try{const x=await api("/api/followups/run",{method:"POST"});toast("تم إنشاء "+x.created+" Follow-up");await load()}catch(e){toast(e.message)}done(b)};
["q"].forEach(id=>$(id).oninput=()=>{clearTimeout(window.t);window.t=setTimeout(load,300)});["city","cat","status"].forEach(id=>$(id).onchange=load);
$("manual").onclick=()=>openM('<h2>إضافة Lead يدوي</h2><div class="grid2"><input id="n" class="input" placeholder="Business name"><input id="ci" class="input" placeholder="City"><input id="ca" class="input" placeholder="Category"><input id="ph" class="input" placeholder="Phone"><input id="we" class="input" placeholder="Website"><input id="ig" class="input" placeholder="Instagram"></div><br><button class="btn primary" onclick="manual()">حفظ وتحليل</button>');
async function manual(){if(!$("n").value)return toast("اكتب اسم النشاط");try{await api("/api/leads",{method:"POST",body:JSON.stringify({businessName:$("n").value,city:$("ci").value||"Sétif",category:$("ca").value||"local_company",phone:$("ph").value,website:$("we").value,instagram:$("ig").value,socialActive:!!$("ig").value,contactable:true})});toast("تمت إضافة وتحليل Lead");closeM();load()}catch(e){toast(e.message)}}
(async()=>{try{const h=await api("/api/health");$("health").textContent=h.ai.connected?"🟢 AI + Discovery":"🟢 Discovery مجاني • AI اختياري"}catch{$("health").textContent="🔴 API غير متاح"}try{await load()}catch(e){toast(e.message)}})();
</script>
</body></html>
