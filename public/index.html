<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GELIN Commerce OS — منصة التجارة الإلكترونية</title><meta name="description" content="GELIN Commerce OS — منصة متكاملة للتجارة الإلكترونية في الجزائر"><style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--brand:#08a36d;--brand2:#067a55;--nav:#0b1320;--nav2:#111c2d;--soft:#ecfdf3;--danger:#d92d20;--warn:#b54708;--shadow:0 12px 35px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:260px;background:linear-gradient(180deg,var(--nav),#0e1725);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 20px;font-weight:900;font-size:21px}.brand span{color:#35d39a}.brand small{display:block;color:#98a2b3;font-size:11px;margin-top:4px}.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;color:#b9c3d0;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav .on{background:var(--nav2);color:#fff}.main{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.top .user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#d1fae5;color:#047857;font-weight:800}.content{padding:26px;max-width:1600px;margin:auto}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.title{font-size:27px;font-weight:850;margin:0}.muted{color:var(--muted)}.kpi{font-size:28px;font-weight:850;margin-top:8px}.row,.between{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:var(--brand);color:#fff;padding:11px 16px;border-radius:10px;font-weight:750}.primary:hover{background:var(--brand2)}.dark{background:#111827;color:#fff;padding:11px 16px;border-radius:10px}.light{background:#f2f4f7;color:#344054;padding:10px 14px;border-radius:10px}.danger{background:#fee4e2;color:#b42318;padding:10px 14px;border-radius:10px}.input,.select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;outline:none}.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #08a36d1a}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:750}.pill.gray{background:#f2f4f7;color:#475467}.pill.orange{background:#fff7ed;color:#b54708}.hero{background:linear-gradient(135deg,#0b1320,#17334a);color:#fff;border-radius:20px;padding:30px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{color:#c9d2dc;max-width:800px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eef0f3;text-align:right}.table th{font-size:12px;color:#667085}.section{margin-top:17px}.chart{height:170px;display:flex;gap:9px;align-items:end}.bar{flex:1;background:linear-gradient(180deg,#22c98b,#0f8f6b);border-radius:8px 8px 2px 2px}.feature{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef0f3}.feature:last-child{border-bottom:0}.preview{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.phead{padding:15px;font-weight:800;border-bottom:1px solid #eee}.phero{padding:40px;background:linear-gradient(135deg,#effcf6,#f8fbff)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}.product{border:1px solid #e7ebf0;border-radius:12px;padding:15px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#dff9ee 0,#f5f8fb 40%,#eef2f6 100%)}.loginbox{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(16,24,40,.12)}.logo{text-align:center;font-size:29px;font-weight:900}.logo span{color:var(--brand)}.login-sub{text-align:center;color:var(--muted);margin:7px 0 22px}.tabs{display:flex;background:#f2f4f7;padding:5px;border-radius:12px;margin:18px 0}.tabs button{flex:1;background:transparent;padding:10px;border-radius:9px;color:#667085}.tabs .active{background:#fff;color:#101828;box-shadow:0 2px 8px #0000000d}.social{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-weight:700;margin-top:9px}.divider{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:12px;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:#eaecf0;flex:1}.legal{font-size:11px;color:#98a2b3;text-align:center;margin-top:18px;line-height:1.7}.status{padding:14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);display:none;margin-top:12px}.mobile-nav{display:none}@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:720px){.app{display:block}.side{position:static;width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.g4,.g3,.g2{grid-template-columns:1fr}.top{padding:0 14px}.content{padding:14px}.products{grid-template-columns:1fr 1fr}.top .email{display:none}}
</style></head><body><div id="root"></div><script>
const KEY='gelin_session_v2';const DATA='gelin_data_v2';let db=JSON.parse(localStorage.getItem(DATA)||'null')||{user:null,trialDays:3,products:[],orders:[],pages:[],stores:[],integrations:{meta:false,tiktok:false,google:false}};let page='dashboard';const save=()=>localStorage.setItem(DATA,JSON.stringify(db));const money=n=>new Intl.NumberFormat('fr-DZ').format(Number(n)||0)+' DZD';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const initials=s=>(String(s||'G').trim()[0]||'G').toUpperCase();
function auth(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">GELIN <span>Commerce OS</span></div><div class="login-sub">منصة احترافية لإدارة تجارتك الإلكترونية في الجزائر</div><div class="tabs"><button id="tabLogin" class="active" onclick="showAuth(false)">تسجيل الدخول</button><button id="tabSignup" onclick="showAuth(true)">إنشاء حساب</button></div><div id="authForm"></div><div id="authStatus" class="status"></div><div class="legal">بالاستمرار، أنت توافق على شروط الاستخدام وسياسة الخصوصية الخاصة بـ GELIN Commerce OS.</div></div></div>`;showAuth(false)}
function showAuth(signup){tabLogin.classList.toggle('active',!signup);tabSignup.classList.toggle('active',signup);authForm.innerHTML=signup?`<div class="field"><label>الاسم الكامل</label><input id="name" class="input" placeholder="مثال: أحمد محمد"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" class="input" type="password" placeholder="••••••••"></div><button class="primary" style="width:100%" onclick="signup()">إنشاء حساب والبدء</button><div class="divider">أو</div><button class="social" onclick="oauth('google')">G &nbsp; المتابعة باستخدام Google</button><button class="social" onclick="oauth('facebook')">f &nbsp; المتابعة باستخدام Facebook</button>`:`<div class="field"><label>البريد الإلكتروني</label><input id="email" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" class="input" type="password" placeholder="••••••••"></div><button class="primary" style="width:100%" onclick="login()">تسجيل الدخول</button><div class="divider">أو</div><button class="social" onclick="oauth('google')">G &nbsp; المتابعة باستخدام Google</button><button class="social" onclick="oauth('facebook')">f &nbsp; المتابعة باستخدام Facebook</button><div style="text-align:center;margin-top:15px"><a href="#" onclick="showAuth(true);return false" class="muted">ليس لديك حساب؟ أنشئ حساباً جديداً</a></div>`}
function showStatus(msg,good=false){authStatus.style.display='block';authStatus.style.background=good?'#ecfdf3':'#fffaeb';authStatus.style.color=good?'#027a48':'#93370d';authStatus.textContent=msg}
function login(){const em=email.value.trim().toLowerCase();if(!em||!password.value)return showStatus('أدخل البريد الإلكتروني وكلمة المرور.');let u=db.user;if(!u||u.email!==em)return showStatus('بيانات الدخول غير صحيحة.');localStorage.setItem(KEY,'1');page='dashboard';render()}
function signup(){const n=name.value.trim(),em=email.value.trim().toLowerCase();if(!n||!em||!password.value)return showStatus('أكمل البيانات المطلوبة.');db.user={name:n,email:em,role:'merchant',createdAt:Date.now(),trialUntil:Date.now()+db.trialDays*86400000};db.stores=[];save();localStorage.setItem(KEY,'1');page='dashboard';render()}
function oauth(provider){const url='/auth/'+provider;showStatus('جارٍ فتح '+(provider==='google'?'Google':'Facebook')+' لتسجيل الدخول بشكل آمن…',true);setTimeout(()=>{window.location.href=url},250)}
function logout(){localStorage.removeItem(KEY);location.reload()}
const navs=[['dashboard','⌂','لوحة التحكم'],['products','▣','المنتجات'],['orders','◫','الطلبات'],['builder','✦','AI Website Builder'],['landing','▤','Landing Pages'],['storefront','◈','Storefront'],['customers','♙','CRM والعملاء'],['delivery','⌁','التوصيل'],['marketing','◉','Meta & TikTok Ads'],['finance','◌','المالية'],['analytics','⌁','Analytics'],['integrations','⚙','التكاملات'],['settings','⚙','الإعدادات']];
function nav(){return `<aside class="side"><div class="brand">GELIN <span>Commerce OS</span><small>Algerian E-Commerce Platform</small></div><div class="nav">${navs.map(x=>`<button class="${page===x[0]?'on':''}" onclick="page='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}<button onclick="logout()">↪ تسجيل الخروج</button></div></aside>`}
function shell(c){const u=db.user||{name:'Merchant',email:''};root.innerHTML=`<div class="app">${nav()}<main class="main"><div class="top"><b>GELIN Commerce OS</b><div class="user"><span class="email">${esc(u.name)} · ${esc(u.email)}</span><span class="avatar">${initials(u.name)}</span></div></div><div class="content">${c}</div></main></div>`}
function dashboard(){const revenue=db.orders.reduce((a,x)=>a+Number(x.total||0),0);return `<div class="hero"><h1>مرحباً ${esc(db.user?.name||'بك')} 👋</h1><p>كل أدوات تجارتك الإلكترونية في مكان واحد: المنتجات، الطلبات، المتجر، صفحات البيع، التوصيل وقياس الإعلانات.</p><span class="pill">تجربة مجانية · ${db.trialDays} أيام</span></div><div class="grid g4 section"><div class="card"><span class="muted">الإيرادات</span><div class="kpi">${money(revenue)}</div></div><div class="card"><span class="muted">الطلبات</span><div class="kpi">${db.orders.length}</div></div><div class="card"><span class="muted">المنتجات</span><div class="kpi">${db.products.length}</div></div><div class="card"><span class="muted">المتاجر</span><div class="kpi">${db.stores.length}</div></div></div><div class="grid g2 section"><div class="card"><div class="between"><b>نظرة على المبيعات</b><span class="pill gray">آخر 7 أيام</span></div><div class="chart">${[28,42,35,55,49,72,88].map(v=>`<div class="bar" style="height:${v}%"></div>`).join('')}</div></div><div class="card"><b>مسار الطلبات</b><div class="feature"><span>طلبات جديدة</span><b>${db.orders.filter(x=>x.status==='NEW').length}</b></div><div class="feature"><span>مؤكدة</span><b>${db.orders.filter(x=>x.status==='CONFIRMED').length}</b></div><div class="feature"><span>تم التوصيل</span><b>${db.orders.filter(x=>x.status==='DELIVERED').length}</b></div></div></div>`}
function products(){return `<div class="between"><div><h2 class="title">المنتجات</h2><span class="muted">الأسعار، المخزون، SKU والمتغيرات</span></div><button class="primary" onclick="addProduct()">+ إضافة منتج</button></div><div class="card section">${db.products.length?`<table class="table"><tr><th>المنتج</th><th>SKU</th><th>السعر</th><th>التكلفة</th><th>المخزون</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td></tr>`).join('')}</table>`:`<div class="empty"><strong>لا توجد منتجات بعد</strong><span>أضف أول منتج لبدء بناء متجرك.</span></div>`}</div>`}
function addProduct(){const n=prompt('اسم المنتج');if(!n)return;db.products.push({id:Date.now(),name:n,sku:'SKU-'+Date.now(),price:0,cost:0,stock:0});save();render()}
function orders(){return `<div class="between"><div><h2 class="title">الطلبات</h2><span class="muted">إدارة الطلبات وCOD والحالات</span></div><button class="primary" onclick="addOrder()">+ إضافة طلب</button></div><div class="card section">${db.orders.length?`<table class="table"><tr><th>ID</th><th>العميل</th><th>الولاية</th><th>الإجمالي</th><th>الحالة</th><th>المصدر</th></tr>${db.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.customer)}</td><td>${esc(o.wilaya)}</td><td>${money(o.total)}</td><td><span class="pill">${esc(o.status)}</span></td><td>${esc(o.source||'—')}</td></tr>`).join('')}</table>`:`<div class="empty"><strong>لا توجد طلبات</strong><span>عندما تصل أول طلبية ستظهر هنا.</span></div>`}</div>`}
function addOrder(){db.orders.unshift({id:'ORD-'+Math.floor(Math.random()*90000+10000),customer:'عميل جديد',wilaya:'Sétif',total:0,status:'NEW',source:'Direct'});save();render()}
function builder(){return `<div class="hero"><h1>AI Website Builder</h1><p>أنشئ هيكل متجر احترافي بالعربية وRTL، مع صفحات المنتج وCOD وCTA.</p><input id="brief" class="input" placeholder="مثال: متجر عطور جزائري أسود وذهبي مع الدفع عند الاستلام"><br><br><button class="primary" onclick="genSite()">إنشاء المتجر بالذكاء الاصطناعي</button></div><div id="out" class="section"></div>`}
function genSite(){out.innerHTML=`<div class="preview"><div class="phead">معاينة المتجر</div><div class="phero"><h2>${esc(brief.value||'متجر احترافي للجزائر')}</h2><p>الدفع عند الاستلام · توصيل إلى 58 ولاية · تأكيد سريع</p><button class="primary">اطلب الآن</button></div></div>`}
function landing(){return `<div class="between"><div><h2 class="title">Landing Pages</h2><span class="muted">صفحات مخصصة للحملات والمنتجات</span></div><button class="primary" onclick="newPage()">+ إنشاء صفحة</button></div><div class="grid g3 section">${db.pages.length?db.pages.map(x=>`<div class="card"><b>${esc(x.name)}</b><p class="muted">Product · COD · Campaign</p><span class="pill">${x.status}</span></div>`).join(''):`<div class="card" style="grid-column:1/-1"><div class="empty"><strong>أنشئ أول Landing Page</strong><span>صمّم صفحة بيع مخصصة لكل منتج وحملة إعلانية.</span></div></div>`}</div>`}
function newPage(){const n=prompt('اسم الصفحة');if(!n)return;db.pages.push({name:n,status:'DRAFT'});save();render()}
function storefront(){return `<h2 class="title">Storefront</h2><div class="preview section"><div class="phead">متجرك الإلكتروني · COD</div><div class="phero"><h1>متجر جاهز للبيع</h1><p>منتجاتك، صفحة المنتج، الطلب والدفع عند الاستلام.</p><button class="primary">تصفح المتجر</button></div>${db.products.length?`<div class="products">${db.products.map(p=>`<div class="product"><h3>${esc(p.name)}</h3><b>${money(p.price)}</b></div>`).join('')}</div>`:`<div class="empty"><strong>أضف المنتجات ليظهر المتجر هنا</strong></div>`}</div>`}
function customers(){return `<h2 class="title">CRM والعملاء</h2><div class="card section"><div class="empty"><strong>لا توجد بيانات عملاء بعد</strong><span>سيتم إنشاء ملفات العملاء تلقائياً مع الطلبات.</span></div></div>`}
function delivery(){return `<h2 class="title">التوصيل</h2><div class="grid g3 section">${['Yalidine','ZR Express','NOEST','Ecotrack','Maystro','ربط شركة مخصصة'].map(x=>`<div class="card"><b>${x}</b><p class="muted">API URL · Token · Webhook · Tracking</p><span class="pill gray">غير متصل</span></div>`).join('')}</div>`}
function marketing(){return `<div class="hero"><h1>Meta Ads & TikTok Ads</h1><p>اربط حساب الإعلانات الخاص بكل متجر، ثم تتبع Pixel وConversions API وEvents API والحملات والإعلانات والإنفاق والـCPA والـROAS والربح.</p></div><div class="grid g3 section">${[['meta','Meta Ads','Marketing API · Ad Account · Pixel · CAPI'],['tiktok','TikTok Ads','Business API · Pixel · Events API'],['google','Google Analytics','GA4 · UTM · Conversions']].map(x=>`<div class="card"><div class="between"><b>${x[1]}</b><span class="pill ${db.integrations[x[0]]?'':'gray'}">${db.integrations[x[0]]?'متصل':'غير متصل'}</span></div><p class="muted">${x[2]}</p><button class="${db.integrations[x[0]]?'danger':'primary'}" onclick="toggleInt('${x[0]}')">${db.integrations[x[0]]?'فصل الحساب':'ربط الحساب'}</button></div>`).join('')}</div>`}
function toggleInt(k){db.integrations[k]=!db.integrations[k];save();render()}
function finance(){const r=db.orders.reduce((a,x)=>a+Number(x.total||0),0);return `<h2 class="title">المالية</h2><div class="grid g4 section"><div class="card">الإيرادات<div class="kpi">${money(r)}</div></div><div class="card">تكلفة المنتجات<div class="kpi">${money(0)}</div></div><div class="card">إنفاق الإعلانات<div class="kpi">0 DZD</div></div><div class="card">الربح<div class="kpi">${money(r)}</div></div></div>`}
function analytics(){const a=db.orders.length?db.orders.reduce((s,x)=>s+Number(x.total||0),0)/db.orders.length:0;return `<h2 class="title">Analytics</h2><div class="grid g3 section"><div class="card">نسبة التأكيد<div class="kpi">—</div></div><div class="card">نسبة التسليم<div class="kpi">—</div></div><div class="card">متوسط الطلب<div class="kpi">${money(a)}</div></div></div>`}
function integrations(){return `<h2 class="title">التكاملات وWebhooks</h2><div class="grid g2 section"><div class="card"><h3>التسويق</h3><div class="feature">Meta OAuth <span class="pill">جاهز للربط</span></div><div class="feature">TikTok OAuth <span class="pill">جاهز للربط</span></div><div class="feature">UTM Attribution <span class="pill">جاهز</span></div></div><div class="card"><h3>الأحداث</h3>${['order.created','order.updated','order.confirmed','order.shipped','order.delivered','order.cancelled','product.updated','inventory.updated','customer.created'].map(x=>`<div class="feature">${x}<span class="pill gray">API</span></div>`).join('')}</div></div>`}
function settings(){return `<h2 class="title">الإعدادات</h2><div class="card section"><h3>التجربة المجانية</h3><div class="field"><label>مدة التجربة بالأيام</label><input id="td" class="input" type="number" min="0" value="${db.trialDays}"></div><button class="primary" onclick="db.trialDays=Math.max(0,Number(td.value)||3);save();render()">حفظ الإعدادات</button></div>`}
function render(){if(!localStorage.getItem(KEY)||!db.user)return auth();const fn={dashboard,products,orders,builder,landing,storefront,customers,delivery,marketing,finance,analytics,integrations,settings}[page]||dashboard;shell(fn())}render();
</script></body></html>
