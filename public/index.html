<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GELIN Commerce OS</title><meta name="description" content="GELIN Commerce OS - منصة التجارة الإلكترونية الجزائرية"><style>:root{--bg:#07110f;--panel:#0d1916;--line:#1c332d;--text:#f4fffb;--muted:#8fa8a0;--g:#19e6a1;--g2:#00b981;--cyan:#39d9ff;--gold:#ffd166;--shadow:0 24px 70px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#104737 0,#07110f 35%),var(--bg);color:var(--text);font-family:Inter,Arial,Tahoma,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 15% 15%,#123d31 0,transparent 35%),radial-gradient(circle at 90% 85%,#063a3c 0,transparent 30%),#050b09}.box{width:min(470px,100%);background:#0b1613ee;border:1px solid #29483e;border-radius:28px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.logo{font-size:31px;font-weight:950;text-align:center}.logo i{font-style:normal;color:var(--g)}.sub{text-align:center;color:var(--muted);margin:8px 0 25px}.tabs{display:flex;background:#07100e;border:1px solid var(--line);padding:4px;border-radius:13px}.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:11px;border-radius:9px}.tabs .active{background:#17342b;color:#fff}.field{margin:14px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#cfe2dc}.input{width:100%;padding:13px 14px;background:#07110f;color:#fff;border:1px solid #29443b;border-radius:11px;outline:none}.input:focus{border-color:var(--g);box-shadow:0 0 0 3px #19e6a11c}.primary,.secondary{border:0;border-radius:11px;padding:12px 17px;font-weight:800}.primary{background:linear-gradient(135deg,var(--g),var(--g2));color:#03140e;box-shadow:0 8px 25px #19e6a122}.secondary{background:#152721;color:#e8fff8;border:1px solid #29483e}.wide{width:100%}.social{width:100%;margin-top:9px;padding:12px;background:#0b1714;color:#fff;border:1px solid #29443b;border-radius:11px}.social:hover,.secondary:hover{border-color:var(--g);transform:translateY(-1px)}.or{display:flex;align-items:center;gap:10px;color:#60766e;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.app{display:flex;min-height:100vh}.side{width:265px;position:fixed;right:0;top:0;bottom:0;padding:22px 14px;background:#081310ee;border-left:1px solid var(--line);backdrop-filter:blur(16px);z-index:10}.brand{font-weight:950;font-size:21px;padding:5px 12px 24px}.brand i{color:var(--g);font-style:normal}.brand small{display:block;color:#607a70;font-size:10px;margin-top:4px}.nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:right;color:#89a39a;background:transparent;border:0;padding:12px;border-radius:12px;margin:3px 0;transition:.2s}.nav button:hover,.nav .on{background:linear-gradient(90deg,#14372d,#10241e);color:#fff;box-shadow:inset -3px 0 var(--g)}.main{margin-right:265px;flex:1;min-width:0}.top{height:72px;position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:0 30px;background:#081310dd;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.top small{color:var(--muted)}.user{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#153c30;color:var(--g);font-weight:900;border:1px solid #285646}.content{padding:30px;max-width:1500px;margin:auto}.hero{position:relative;overflow:hidden;padding:30px;border:1px solid #295246;border-radius:24px;background:linear-gradient(135deg,#102b23,#0b1916 60%,#09252a);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#19e6a115;left:-70px;top:-80px;filter:blur(5px)}h1{font-size:31px;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.section{margin-top:18px}.card{background:linear-gradient(180deg,#0e1c18,#0b1714);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 12px 35px #0002}.kpi{font-size:27px;font-weight:900;margin-top:9px}.label{font-size:13px;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;background:#12382d;color:#7dffca;font-size:11px;font-weight:800}.pill.gold{background:#3c3015;color:#ffd86e}.chart{height:190px;display:flex;gap:10px;align-items:end;margin-top:20px}.bar{flex:1;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--g),#087b5d);min-height:8px;animation:rise .7s both}@keyframes rise{from{height:0!important}}.metric{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 8px;border-bottom:1px solid var(--line);text-align:right}.table th{font-size:11px;color:#70877e}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty b{display:block;color:#fff;font-size:18px;margin-bottom:7px}.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f7faf9;color:#10201b}.previewhead{padding:14px;background:#fff;font-weight:900}.previewhero{padding:45px 25px;background:linear-gradient(135deg,#e6fff5,#dff7ff);text-align:center}.previewproducts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.p{background:#fff;border:1px solid #dfe8e4;border-radius:12px;padding:18px;text-align:center}.toast{position:fixed;left:25px;bottom:25px;background:#11221d;border:1px solid #2b5749;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:50;animation:toast .25s}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40;padding:20px}.modalbox{width:min(600px,100%);background:#0d1916;border:1px solid #2a4a40;border-radius:20px;padding:22px;box-shadow:var(--shadow)}@keyframes toast{from{transform:translateY(10px);opacity:0}}@media(max-width:1000px){.side{width:82px}.brand i,.brand small,.nav button span:last-child{display:none}.nav button{justify-content:center}.main{margin-right:82px}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{display:none}.main{margin-right:0}.content{padding:15px}.top{padding:0 15px}.top small{display:none}.g4,.g3,.g2{grid-template-columns:1fr}.previewproducts{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script>const KEY='gelin_session';const D='gelin_os';let db=JSON.parse(localStorage.getItem(D)||'null')||{user:null,products:[],orders:[],pages:[],stores:[],trial:3,meta:false,tiktok:false};let page='dashboard';const save=()=>localStorage.setItem(D,JSON.stringify(db));const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>new Intl.NumberFormat('fr-DZ').format(Number(x)||0)+' DZD';function initials(x){return (x||'G').trim().slice(0,1).toUpperCase()}function auth(){root.innerHTML='<div class="login"><div class="box"><div class="logo">GELIN <i>Commerce OS</i></div><div class="sub">بنية احترافية لإدارة تجارتك الإلكترونية من مكان واحد</div><div class="tabs"><button id="tl" class="active" onclick="formAuth(0)">دخول</button><button id="ts" onclick="formAuth(1)">حساب جديد</button></div><div id="af"></div><div class="or">أو</div><button class="social" onclick="oauth(\'google\')">G &nbsp; المتابعة باستخدام Google</button><button class="social" onclick="oauth(\'facebook\')">f &nbsp; المتابعة باستخدام Facebook</button><p id="msg" class="muted" style="font-size:12px;text-align:center;margin-top:15px"></p></div></div>';formAuth(0)}function formAuth(sign){tl.classList.toggle('active',!sign);ts.classList.toggle('active',sign);af.innerHTML=sign?'<div class="field"><label>الاسم الكامل</label><input id="n" class="input" placeholder="اسمك الكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="e" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="p" class="input" type="password" placeholder="••••••••"></div><button class="primary wide" onclick="signup()">إنشاء حساب والبدء</button>':'<div class="field"><label>البريد الإلكتروني</label><input id="e" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="p" class="input" type="password" placeholder="••••••••"></div><button class="primary wide" onclick="login()">تسجيل الدخول</button>'}function signup(){if(!n.value||!e.value||!p.value)return msg.textContent='أكمل البيانات المطلوبة.';db.user={name:n.value,email:e.value.toLowerCase(),created:Date.now(),trialUntil:Date.now()+db.trial*864e5};save();localStorage.setItem(KEY,'1');render();toast('تم إنشاء حسابك بنجاح')}function login(){if(!db.user||db.user.email!==e.value.toLowerCase())return msg.textContent='الحساب غير موجود. أنشئ حساباً جديداً أولاً.';localStorage.setItem(KEY,'1');render();toast('تم تسجيل الدخول')}function oauth(x){msg.textContent='OAuth يحتاج مفاتيح Google/Facebook في الخادم قبل تفعيله فعلياً.'}function logout(){localStorage.removeItem(KEY);location.reload()}const navs=[['dashboard','⌂','الرئيسية'],['products','▣','المنتجات'],['orders','◫','الطلبات'],['builder','✦','AI Website Builder'],['landing','▤','Landing Pages'],['storefront','◈','المتجر'],['customers','♙','العملاء CRM'],['delivery','⌁','التوصيل'],['marketing','◉','Meta & TikTok'],['finance','◌','المالية'],['analytics','◒','Analytics'],['integrations','⚙','التكاملات'],['settings','⚙','الإعدادات']];function sidebar(){return '<aside class="side"><div class="brand">GELIN <i>Commerce OS</i><small>ALGERIAN COMMERCE INFRASTRUCTURE</small></div><div class="nav">'+navs.map(x=>'<button class="'+(page===x[0]?'on':'')+'" onclick="page=\''+x[0]+'\';render()"><span>'+x[1]+'</span><span>'+x[2]+'</span></button>').join('')+'<button onclick="logout()"><span>↪</span><span>خروج</span></button></div></aside>'}function shell(c){root.innerHTML='<div class="app">'+sidebar()+'<main class="main"><header class="top"><div><b>GELIN Commerce OS</b><br><small>مساحة العمل الخاصة بك</small></div><div class="user"><span class="muted">'+esc(db.user?.name)+'</span><span class="avatar">'+initials(db.user?.name)+'</span></div></header><div class="content">'+c+'</div></main></div>'}function dashboard(){let rev=db.orders.reduce((a,x)=>a+Number(x.total||0),0);return '<section class="hero"><div class="between"><div><h1>مرحباً '+esc(db.user?.name||'بك')+' 👋</h1><p class="muted">من لوحة واحدة، أنشئ متجرك، أدر المنتجات والطلبات، واربط التسويق والتوصيل.</p></div><button class="primary" onclick="page=\'builder\';render()">✦ أنشئ متجرك بالـAI</button></div></section><div class="grid g4 section"><div class="card"><span class="label">الإيرادات</span><div class="kpi">'+money(rev)+'</div></div><div class="card"><span class="label">الطلبات</span><div class="kpi">'+db.orders.length+'</div></div><div class="card"><span class="label">المنتجات</span><div class="kpi">'+db.products.length+'</div></div><div class="card"><span class="label">المتاجر</span><div class="kpi">'+db.stores.length+'</div></div></div><div class="grid g2 section"><div class="card"><div class="between"><b>أداء المبيعات</b><span class="pill">آخر 7 أيام</span></div><div class="chart">'+[34,51,43,67,58,76,91].map(v=>'<div class="bar" style="height:'+v+'%"></div>').join('')+'</div></div><div class="card"><b>ابدأ من هنا</b><div class="metric"><span>أضف أول منتج</span><button class="secondary" onclick="addProduct()">إضافة</button></div><div class="metric"><span>أنشئ واجهة المتجر</span><button class="secondary" onclick="page=\'builder\';render()">Builder</button></div><div class="metric"><span>اربط Meta Ads</span><button class="secondary" onclick="page=\'marketing\';render()">ربط</button></div></div></div>'}function products(){return '<div class="between"><div><h1>المنتجات</h1><span class="muted">الأسعار، المخزون، SKU والمتغيرات</span></div><button class="primary" onclick="addProduct()">+ إضافة منتج</button></div><div class="card section">'+(db.products.length?'<table class="table"><tr><th>المنتج</th><th>SKU</th><th>السعر</th><th>المخزون</th></tr>'+db.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.sku)+'</td><td>'+money(p.price)+'</td><td>'+p.stock+'</td></tr>').join('')+'</table>':'<div class="empty"><b>لا توجد منتجات بعد</b>أضف أول منتج لبدء بناء متجرك.</div>')+'</div>'}function addProduct(){let n=prompt('اسم المنتج');if(!n)return;db.products.push({id:Date.now(),name:n,sku:'SKU-'+Date.now(),price:0,stock:0});save();render();toast('تمت إضافة المنتج')}function orders(){return '<div class="between"><div><h1>الطلبات</h1><span class="muted">إدارة الطلبات وCOD والحالات</span></div><button class="primary" onclick="addOrder()">+ إضافة طلب</button></div><div class="card section">'+(db.orders.length?'<table class="table"><tr><th>ID</th><th>العميل</th><th>الولاية</th><th>الإجمالي</th><th>الحالة</th></tr>'+db.orders.map(o=>'<tr><td>'+esc(o.id)+'</td><td>'+esc(o.customer)+'</td><td>'+esc(o.wilaya)+'</td><td>'+money(o.total)+'</td><td><span class="pill">'+esc(o.status)+'</span></td></tr>').join('')+'</table>':'<div class="empty"><b>لا توجد طلبات</b>عندما تصل أول طلبية ستظهر هنا.</div>')+'</div>'}function addOrder(){db.orders.unshift({id:'ORD-'+Math.floor(Math.random()*90000+10000),customer:'عميل جديد',wilaya:'Sétif',total:0,status:'NEW'});save();render();toast('تم تسجيل الطلب')}function builder(){return '<div class="hero"><h1>AI Website Builder ✦</h1><p>أنشئ هيكل متجر احترافي بالعربية وRTL، مع صفحات المنتج وCOD وCTA.</p><textarea id="brief" class="input" style="min-height:100px;resize:vertical" placeholder="مثال: متجر منتجات منزلية ذكية للجزائر"></textarea><br><br><button class="primary" onclick="genSite()">إنشاء المتجر بالذكاء الاصطناعي</button></div><div id="out" class="section"></div>'}function genSite(){out.innerHTML='<div class="preview"><div class="previewhead">معاينة المتجر</div><div class="previewhero"><h2>'+esc(brief.value||'متجر احترافي للجزائر')+'</h2><p>الدفع عند الاستلام · توصيل إلى 58 ولاية · تأكيد سريع</p><button class="primary">اطلب الآن</button></div><div class="previewproducts"><div class="p">منتج 01<br><b>2,900 DZD</b></div><div class="p">منتج 02<br><b>3,500 DZD</b></div><div class="p">منتج 03<br><b>4,200 DZD</b></div></div></div>'}function cards(title,desc,items){return '<div><h1>'+title+'</h1><span class="muted">'+desc+'</span></div><div class="grid g3 section">'+items.map(i=>'<div class="card"><div class="between"><b>'+i[0]+'</b><span class="pill">'+(i[1]||'متاح')+'</span></div><p class="muted">'+(i[2]||'إدارة هذه الوحدة من مكان واحد.')+'</p><button class="secondary" onclick="toast(\'تم تنفيذ الإجراء\')">فتح</button></div>').join('')+'</div>'}function pageContent(){if(page==='dashboard')return dashboard();if(page==='products')return products();if(page==='orders')return orders();if(page==='builder')return builder();if(page==='landing')return cards('Landing Pages','صفحات بيع سريعة وعالية التحويل',[['صفحات المنتجات','جاهزة'],['A/B Testing','متاح'],['نماذج COD','58 ولاية']]);if(page==='storefront')return cards('Storefront','واجهة متجرك والدومين',[['Theme Studio','نشط'],['Custom Domain','جاهز'],['Checkout COD','نشط']]);if(page==='customers')return cards('CRM والعملاء','ملفات العملاء والمتابعة',[['كل العملاء','متاح'],['العملاء الجدد','متاح'],['إعادة الاستهداف','متاح']]);if(page==='delivery')return cards('التوصيل','ربط شركات التوصيل وإدارة الشحنات',[['Yalidine','ربط'],['ZR Express','ربط'],['Ecotrack','ربط']]);if(page==='marketing')return '<div><h1>Meta & TikTok Ads</h1><span class="muted">اربط حساباتك الإعلانية وحلل الأداء.</span></div><div class="grid g2 section"><div class="card"><div class="between"><div><b>Meta Ads</b><p class="muted">Pixel · CAPI · Marketing API</p></div><button class="secondary" onclick="db.meta=!db.meta;save();render()">'+(db.meta?'متصل':'ربط')+'</button></div></div><div class="card"><div class="between"><div><b>TikTok Ads</b><p class="muted">Pixel · Events API · Ads</p></div><button class="secondary" onclick="db.tiktok=!db.tiktok;save();render()">'+(db.tiktok?'متصل':'ربط')+'</button></div></div></div>';if(page==='finance')return cards('المالية','الإيرادات والمصاريف والربحية',[['الإيرادات',money(db.orders.reduce((a,x)=>a+Number(x.total||0),0))],['المصاريف','0 DZD'],['الربح','0 DZD']]);if(page==='analytics')return '<div><h1>Analytics</h1><span class="muted">قياس الأداء واتخاذ القرار.</span></div><div class="grid g4 section">'+[['ROAS','—'],['CPA','—'],['Conversion','—'],['Profit','0 DZD']].map(x=>'<div class="card"><span class="label">'+x[0]+'</span><div class="kpi">'+x[1]+'</div></div>').join('')+'</div>';if(page==='integrations')return cards('التكاملات','الخدمات المرتبطة بمنصتك',[['Google Analytics','جاهز'],['WhatsApp / SMS','جاهز'],['Webhooks','جاهز']]);return cards('الإعدادات','إعدادات الحساب والمتجر',[['الحساب','نشط'],['التجربة المجانية',db.trial+' أيام'],['الأمان','محمي']])}function render(){if(!localStorage.getItem(KEY)||!db.user)return auth();shell(pageContent())}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}render();</script></body></html>
