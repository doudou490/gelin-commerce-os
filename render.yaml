services:
  - type: web
    name: gelin-commerce-os
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gelin-commerce-db
          property: connectionString
      - key: PGSSL
        value: "true"

databases:
  - name: gelin-commerce-db
    databaseName: gelin_commerce
    plan: free
